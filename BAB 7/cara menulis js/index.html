<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar JS</title>
</head>
<body>
    <!-- cara menulis javascript -->
    <table cellpadding="10" cellspacing="0" border="1">
        <tr>
            <th>Cara</th>
            <th>Lokasi</th>
            <th>Kelebihan</th>
            <th>Kekurangan</th>
        </tr>
        <tr>
            <td>Internal</td>
            <td>Di dalam tag &lt;script&gt; di file HTML</td>
            <td>Mudah dimulai, tidak perlu file terpisah</td>
            <td>Sulit di pelihara untuk kode panjang</td>
        </tr>
        <tr>
            <td>Eksternal</td>
            <td>Di file .js terpisah, dihubungkan dengan &lt;script src&gt;</td>
            <td>Kode terpisah dapat digunakan ulang, lebih rapi</td>
            <td>Butuh file tambahan</td>
        </tr>
    </table>

    <!-- INTERNAL JavaScript: didalam tag <script> -->
    <h1>Hello World</h1>

    <!-- Letakan <script> sebelum /body agar html dimual dulu -->
    <!-- <script>
        // ini adalah komentar
        console.log("Halo dari JavaScript");
        alert("Selamat datang di JavaScript!");
    </script> -->
    <script type="text/javascript" src="variabel dan tipe data/code.js"></script>
</body>
</html>
