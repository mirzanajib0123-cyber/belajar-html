<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <table></table>
    <!-- Label yang terhubung dengan input -->
    <label for="email">Alamat Email:</label>
    <input
      type="email"
      id="email"
      name="email"
      required
      placeholder="contoh@email.com"
    />
    <br />
    <!-- Textarea -->
    <label for="pesan">Pesan:</label>
    <textarea
      id="pesan"
      name="pesan"
      rows="5"
      cols="40"
      placeholder="Tuliskan pesan kamu di sini..."
    ></textarea>
    <br />
    <!-- Select / Dropdown -->
    <label for="jurusan">Pilih Jurusan:</label>
    <select id="jurusan" name="jurusan">
      <option value="">-- Pilih Jurusan --</option>
      <optgroup label="Teknologi Informasi">
        <option value="rpl">Rekayasa Perangkat Lunak</option>
        <option value="tkj">Teknik Komputer Jaringan</option>
      </optgroup>
      <optgroup label="Bisnis">
        <option value="ak">Akuntansi</option>
        <option value="pm">Pemasaran</option>
      </optgroup>

      <!-- Bagian Atas: Select dan Optgroup -->
      <select>
        <optgroup label="Jurusan">
          <!-- Elemen pembuka optgroup diasumsikan dari konteks -->
          <option value="pm">Pemasaran</option>
        </optgroup>
      </select>

      <!-- Bagian Bawah: Fieldset & Legend -->
      <!-- Fieldset & Legend -->
      <fieldset>
        <legend>Data Pribadi</legend>
        <label for="nama">Nama:</label>
        <input type="text" id="nama" name="nama" />
      </fieldset>
    </select>
  </body>
</html>
