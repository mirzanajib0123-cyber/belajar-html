<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            font-style:italic ;
            font-weight: bold;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <!--radio button: hanya bisa memilih SATU opsi-->
    <!--di gunakan nama yang sama untuk memngelompokan pilihan-->
    <p>jenus kelamin:</p>
    <input type="radio" name="gender" id="laki" value="L">
    <label for="laki">laki laki</label>

    <input type="radio" name="gender" id="permpuan" value="F">
    <label for="perempuan">perempuan</label>

    <!--checkbox: bisa memilih LEBIH DARI SATU opsi-->
    <p>hobi (boleh pilih dari satu):</p>
    <input type="checkbox" id="coding" name="hobi" value="coding">
    <label for="cooding">caoding</label>

    <input type="checkbox" name="hobi" id="membaca" value="membaca">
    <label for="membaca">membaca</label>

    <input type="checkbox" id="gaming" name="hobi" value="gaming">
    <label for="gaming">gaming</label><br>

    <!-- checkbox dengan checked (sudah di centang secara default)-->
    <P></P><input type="checkbox" name="setuju" id="setuju" value="ya" checked>
     <label for="setuju">saya setuju syarat dan ketentuan</label>
    

</body>
</html>
