<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1 {
            color: #1a5276;
            text-align: center;
        }

        p {
            font-size: 16px;
            line-height: 1.8;

        }
    </style>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 1. inline css: ditulis langsung di atribut style elemen -->
    <h1 style="color: blue; font-size: 28px;">smk tjp</h1>
    <p style="color: gray; margin: 10px;">THE WINNER</p>

    <!-- 2. internal css: ditulis di dalam tag <style> di bagian <head> -->
    <h1>prikitiw</h1>
    <p>prikitiw lagi</p>

    <!-- 3. external css: file .css terpisah, di hubungkan dengan tag <link> -->
     <h1>we wok the tok</h1>
</body>
</html>
